name: Flutter Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Muito importante: Dá permissão pro robô salvar no seu GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recriar pastas estruturais (Android, iOS)
        run: flutter create .

      - name: Salvar as pastas no GitHub para sempre
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android/ ios/ web/ macos/ linux/ windows/
          git commit -m "Recriando pastas estruturais do Flutter" || echo "Sem mudanças para salvar"
          git push

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-debug.apk
